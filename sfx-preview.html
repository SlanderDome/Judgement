<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Judgement SFX Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --felt: #0c5640;
        --felt-deep: #04110d;
        --gold: #e7cf8f;
        --ivory: #f6efe1;
        --muted: rgba(246, 239, 225, 0.68);
        --line: rgba(246, 239, 225, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ivory);
        font: 16px/1.5 system-ui, sans-serif;
        background:
          radial-gradient(80% 70% at 50% 0%, rgba(15, 97, 74, 0.5), transparent 70%),
          linear-gradient(145deg, var(--felt), var(--felt-deep));
      }

      main {
        width: min(720px, 100%);
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(4, 17, 13, 0.76);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      }

      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(2rem, 6vw, 3.5rem); }
      p { color: var(--muted); }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin: 28px 0 22px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
      }

      label { display: flex; align-items: center; gap: 10px; color: var(--muted); }
      input[type="range"] { accent-color: var(--gold); width: 150px; }

      button {
        min-height: 46px;
        padding: 10px 16px;
        border: 1px solid rgba(231, 207, 143, 0.5);
        border-radius: 10px;
        color: #171008;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(180deg, #f2dfa8, var(--gold));
        transition: transform 140ms ease, filter 140ms ease;
      }

      button:hover { filter: brightness(1.08); transform: translateY(-1px); }
      button:active { transform: translateY(1px); }

      .sounds { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
      .sounds button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
      .sounds small { color: rgba(23, 16, 8, 0.68); font-weight: 500; }
      #status { min-height: 1.5em; margin: 18px 0 0; color: var(--gold); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Judgement SFX</h1>
      <p>Preview the proposed synthesized sound palette. Click a sound to hear it.</p>

      <div class="toolbar">
        <button id="enable" type="button">Enable audio</button>
        <label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.35" /><output id="volume-value">35%</output></label>
      </div>

      <section class="sounds" aria-label="Sound effects">
        <button data-sound="card" type="button">Card played <small>Soft click and pitch lift</small></button>
        <button data-sound="hover" type="button">Card hover <small>Quiet tactile tick</small></button>
        <button data-sound="select" type="button">Card selected <small>Confident selection blip</small></button>
        <button data-sound="bid" type="button">Bid submitted <small>Short confirmation chime</small></button>
        <button data-sound="start" type="button">Start bidding <small>Warm two-note cue</small></button>
        <button data-sound="deal" type="button">Cards dealing <small>Light table shuffle</small></button>
        <button data-sound="seat" type="button">Seat taken <small>Warm confirmation tone</small></button>
        <button data-sound="invalid" type="button">Invalid action <small>Soft low warning</small></button>
        <button data-sound="trick" type="button">Trick complete <small>Low resolve and sparkle</small></button>
        <button data-sound="round" type="button">Round complete <small>Compact success flourish</small></button>
        <button data-sound="timer" type="button">Timer warning <small>Urgent but restrained pulse</small></button>
        <button data-sound="pause" type="button">Pause / resume <small>Short state-change cue</small></button>
        <button data-sound="game" type="button">Game over <small>Measured final cadence</small></button>
      </section>
      <div id="status" role="status">Audio is disabled until enabled.</div>
    </main>

    <script>
      let context;
      let master;
      let noiseBuffer;
      const status = document.querySelector("#status");
      const volume = document.querySelector("#volume");
      const volumeValue = document.querySelector("#volume-value");

      function setupAudio() {
        context ||= new (window.AudioContext || window.webkitAudioContext)();
        master ||= context.createGain();
        noiseBuffer ||= createNoiseBuffer();
        master.gain.value = Number(volume.value);
        master.connect(context.destination);
        if (context.state === "suspended") context.resume();
        status.textContent = "Audio enabled. Choose a sound.";
      }

      function createNoiseBuffer() {
        const buffer = context.createBuffer(1, context.sampleRate * 2, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let index = 0; index < data.length; index += 1) {
          data[index] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      function tone(frequency, start, duration, type = "sine", gain = 0.16) {
        const oscillator = context.createOscillator();
        const envelope = context.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        envelope.gain.setValueAtTime(0.0001, start);
        envelope.gain.exponentialRampToValueAtTime(gain, start + 0.012);
        envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(envelope).connect(master);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function noise(start, duration, gain = 0.1, filterType = "bandpass", frequency = 1800, q = 0.8) {
        const source = context.createBufferSource();
        const filter = context.createBiquadFilter();
        const envelope = context.createGain();
        source.buffer = noiseBuffer;
        filter.type = filterType;
        filter.frequency.setValueAtTime(frequency, start);
        filter.Q.value = q;
        envelope.gain.setValueAtTime(0.0001, start);
        envelope.gain.exponentialRampToValueAtTime(gain, start + 0.004);
        envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        source.connect(filter).connect(envelope).connect(master);
        source.start(start);
        source.stop(start + duration + 0.02);
      }

      function sweep(from, to, start, duration, gain = 0.08) {
        const oscillator = context.createOscillator();
        const envelope = context.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(from, start);
        oscillator.frequency.exponentialRampToValueAtTime(to, start + duration);
        envelope.gain.setValueAtTime(0.0001, start);
        envelope.gain.exponentialRampToValueAtTime(gain, start + 0.01);
        envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(envelope).connect(master);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function play(name) {
        setupAudio();
        const now = context.currentTime + 0.01;
        if (name === "card") {
          noise(now, 0.055, 0.2, "highpass", 2400, 0.4);
          noise(now + 0.045, 0.12, 0.11, "lowpass", 900, 0.5);
          tone(125, now + 0.04, 0.09, "triangle", 0.12);
        } else if (name === "hover") {
          noise(now, 0.025, 0.035, "bandpass", 3200, 1.2);
        } else if (name === "select") {
          noise(now, 0.045, 0.08, "bandpass", 1800, 0.7);
          tone(240, now + 0.03, 0.12, "triangle", 0.1);
          tone(360, now + 0.08, 0.16, "sine", 0.07);
        } else if (name === "bid") {
          noise(now, 0.025, 0.13, "bandpass", 1100, 2);
          tone(392, now + 0.025, 0.12, "triangle", 0.1);
          tone(587, now + 0.1, 0.2, "sine", 0.08);
        } else if (name === "start") {
          noise(now, 0.04, 0.08, "lowpass", 700, 0.8);
          tone(262, now + 0.04, 0.18, "triangle", 0.11);
          tone(392, now + 0.16, 0.3, "sine", 0.1);
        } else if (name === "deal") {
          for (let index = 0; index < 4; index += 1) {
            const start = now + index * 0.11;
            noise(start, 0.07, 0.1, "bandpass", 1900 + index * 180, 0.45);
            tone(110 + index * 12, start + 0.04, 0.09, "triangle", 0.07);
          }
        } else if (name === "seat") {
          noise(now, 0.035, 0.1, "lowpass", 500, 0.7);
          tone(196, now + 0.03, 0.14, "triangle", 0.1);
          tone(294, now + 0.12, 0.22, "sine", 0.08);
        } else if (name === "invalid") {
          noise(now, 0.025, 0.06, "lowpass", 420, 1.2);
          tone(110, now + 0.015, 0.16, "triangle", 0.09);
        } else if (name === "trick") {
          noise(now, 0.14, 0.1, "bandpass", 1250, 0.5);
          tone(196, now + 0.05, 0.22, "triangle", 0.12);
          tone(294, now + 0.16, 0.3, "sine", 0.1);
          tone(587, now + 0.27, 0.2, "sine", 0.06);
        } else if (name === "round") {
          noise(now, 0.04, 0.08, "lowpass", 650, 0.8);
          tone(330, now + 0.04, 0.18, "triangle", 0.1);
          tone(494, now + 0.15, 0.2, "sine", 0.1);
          tone(740, now + 0.27, 0.36, "sine", 0.08);
        } else if (name === "timer") {
          noise(now, 0.02, 0.06, "bandpass", 1600, 2);
          tone(660, now + 0.01, 0.07, "triangle", 0.06);
          noise(now + 0.17, 0.02, 0.06, "bandpass", 1600, 2);
          tone(660, now + 0.18, 0.07, "triangle", 0.06);
        } else if (name === "pause") {
          sweep(300, 170, now, 0.2, 0.08);
          noise(now, 0.03, 0.05, "lowpass", 500, 0.8);
        } else if (name === "game") {
          noise(now, 0.045, 0.07, "lowpass", 650, 0.8);
          tone(392, now + 0.04, 0.2, "sine", 0.09);
          tone(330, now + 0.2, 0.22, "sine", 0.08);
          tone(262, now + 0.38, 0.42, "triangle", 0.1);
        }
        status.textContent = `Playing: ${name}`;
      }

      document.querySelector("#enable").addEventListener("click", setupAudio);
      document.querySelectorAll("[data-sound]").forEach((button) => {
        button.addEventListener("click", () => play(button.dataset.sound));
      });
      volume.addEventListener("input", () => {
        volumeValue.textContent = `${Math.round(Number(volume.value) * 100)}%`;
        if (master) master.gain.value = Number(volume.value);
      });
    </script>
  </body>
</html>
